<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="refresh" content="0;url=https://english-placement-test.petermangiaracina-english.workers.dev/">
  <title>English Placement Test — Peter Mangiaracina</title>
  <style>
    :root{--paper:#efede6;--ink:#20221f;--red:#a33729;--muted:#62645d}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    main{width:min(760px,calc(100% - 44px));margin:auto;min-height:100vh;display:grid;align-content:center;padding:48px 0}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-bottom:22px}
    .eyebrow{color:var(--red);font-size:11px;font-weight:700;letter-spacing:1.7px;text-transform:uppercase}
    h1{font-size:clamp(42px,8vw,76px);line-height:.98;letter-spacing:-.055em;margin:18px 0 26px}
    p{font-family:Georgia,serif;font-size:21px;line-height:1.55;color:var(--muted);max-width:620px}
    a{display:inline-block;width:max-content;margin-top:16px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:14px 18px;text-decoration:none;font:700 11px Arial,sans-serif;letter-spacing:1.2px;text-transform:uppercase}
    a:hover,a:focus-visible{background:var(--red);border-color:var(--red)}
  </style>
  <script>location.replace("https://english-placement-test.petermangiaracina-english.workers.dev/");</script>
</head>
<body>
  <main>
    <div class="dot" aria-hidden="true"></div>
    <div class="eyebrow">Private student assessment</div>
    <h1>Opening the English Placement Test.</h1>
    <p>You are being transferred to the secure assessment. If it does not open automatically, use the button below.</p>
    <a href="https://english-placement-test.petermangiaracina-english.workers.dev/" rel="noreferrer">Continue to the test →</a>
  </main>
</body>
</html>
