media:
  input: _cms_sandbox/media
  output: /_cms_sandbox/media

content:
  - name: sandbox
    label: CMS Test Area (not published)
    type: collection
    path: _cms_sandbox/entries
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: body
        label: Test text
        type: rich-text
