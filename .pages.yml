media:
  input: _cms_sandbox/media
  output: /_cms_sandbox/media

content:
  - name: sandbox
    label: CMS Test Area (not published)
    type: collection
    path: _cms_sandbox/entries
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: body
        label: Test text
        type: rich-text
  - name: teaching-method
    label: Teaching Method (live homepage)
    type: file
    path: cms-content/method.json
    fields:
      - name: intro
        label: First paragraph of My Teaching Method
        type: text
        required: true
