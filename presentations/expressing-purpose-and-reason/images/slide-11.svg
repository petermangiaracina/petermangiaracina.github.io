<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#efede6"/><rect x="0" y="0" width="34" height="900" fill="#a33729"/><text x="110" y="72" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="4" fill="#62645d">ENGLISH IN YOUR FACE / GRAMMAR</text><text x="1490" y="72" text-anchor="end" font-family="Arial" font-size="22" fill="#a33729">11</text><line x1="110" y1="100" x2="1490" y2="100" stroke="#c4c4b8" stroke-width="2"/><text x="110" y="165" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#20221f">Correct the mistake</text><text x="110" y="220" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">WRONG: I went outside for smoking a cigarette.</text><text x="110" y="268" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">RIGHT: I went outside to smoke a cigarette.</text><text x="110" y="316" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#20221f"></text><text x="110" y="342" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">WRONG: We stayed home because of it was raining.</text><text x="110" y="390" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">RIGHT: We stayed home because it was raining.</text><text x="110" y="438" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#20221f"></text><text x="110" y="464" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">WRONG: The flight was canceled because the bad weather.</text><text x="110" y="512" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">RIGHT: The flight was canceled because of the bad weather.</text><text x="110" y="842" font-family="Arial" font-size="20" font-weight="700" fill="#a33729">Common transfer errors for Spanish speakers.</text><text x="1490" y="842" text-anchor="end" font-family="Arial" font-size="18" fill="#62645d">PETER MANGIARACINA</text></svg>