<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#efede6"/><rect x="0" y="0" width="34" height="900" fill="#a33729"/><text x="110" y="72" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="4" fill="#62645d">ENGLISH IN YOUR FACE / GRAMMAR</text><text x="1490" y="72" text-anchor="end" font-family="Arial" font-size="22" fill="#a33729">12</text><line x1="110" y1="100" x2="1490" y2="100" stroke="#c4c4b8" stroke-width="2"/><text x="110" y="165" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#20221f">Complete the sentence</text><text x="110" y="220" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">Choose from: to | in order to | so | because | because of | since</text><text x="110" y="268" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#20221f"></text><text x="110" y="294" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">1 I called the restaurant ___ make a reservation.</text><text x="110" y="342" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">2 We couldn't play tennis ___ the rain.</text><text x="110" y="390" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">3 She spoke slowly ___ everyone could understand her.</text><text x="110" y="438" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">4 He stayed home ___ he was sick.</text><text x="110" y="486" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">5 I left early ___ arrive on time.</text><text x="110" y="534" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">6 ___ you're going to the supermarket, please buy some milk.</text><text x="110" y="842" font-family="Arial" font-size="20" font-weight="700" fill="#a33729">ANSWERS: 1 to · 2 because of · 3 so · 4 because · 5 to* · 6 Since · 7 because of · 8 to*</text><text x="1490" y="842" text-anchor="end" font-family="Arial" font-size="18" fill="#62645d">PETER MANGIARACINA</text></svg>