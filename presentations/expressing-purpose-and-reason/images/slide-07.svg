<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#efede6"/><rect x="0" y="0" width="34" height="900" fill="#a33729"/><text x="110" y="72" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="4" fill="#62645d">ENGLISH IN YOUR FACE / GRAMMAR</text><text x="1490" y="72" text-anchor="end" font-family="Arial" font-size="22" fill="#a33729">07</text><line x1="110" y1="100" x2="1490" y2="100" stroke="#c4c4b8" stroke-width="2"/><text x="110" y="165" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#20221f">BECAUSE introduces a clause</text><text x="110" y="220" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">BECAUSE + CLAUSE</text><text x="110" y="268" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">A clause contains a subject + verb.</text><text x="110" y="316" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#20221f"></text><text x="110" y="342" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">I stayed home because I was sick.</text><text x="110" y="390" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">She was late because she missed the bus.</text><text x="110" y="438" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">We canceled the picnic because it was raining.</text><text x="110" y="486" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">He bought the car because he liked it.</text><text x="110" y="842" font-family="Arial" font-size="20" font-weight="700" fill="#a33729">REASON = WHY SOMETHING HAPPENS</text><text x="1490" y="842" text-anchor="end" font-family="Arial" font-size="18" fill="#62645d">PETER MANGIARACINA</text></svg>