<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#efede6"/><rect x="0" y="0" width="34" height="900" fill="#a33729"/><text x="110" y="72" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="4" fill="#62645d">ENGLISH IN YOUR FACE / GRAMMAR</text><text x="1490" y="72" text-anchor="end" font-family="Arial" font-size="22" fill="#a33729">13</text><line x1="110" y1="100" x2="1490" y2="100" stroke="#c4c4b8" stroke-width="2"/><text x="110" y="165" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#20221f">Quick reference</text><text x="110" y="220" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">PURPOSE  to + infinitive</text><text x="110" y="268" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">PURPOSE  in order to + infinitive</text><text x="110" y="316" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">PURPOSE  so (that) + clause</text><text x="110" y="364" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">PURPOSE / RECIPIENT  for + noun</text><text x="110" y="412" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">REASON  because + clause</text><text x="110" y="460" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">REASON  because of + noun</text><text x="110" y="508" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">REASON  since + clause</text><text x="110" y="556" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#20221f"></text><text x="110" y="582" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">NO FOR + GERUND.</text><text x="110" y="842" font-family="Arial" font-size="20" font-weight="700" fill="#a33729">KEEP THIS: PURPOSE → to + infinitive   •   FOR → + noun   •   REASON → because / since + clause</text><text x="1490" y="842" text-anchor="end" font-family="Arial" font-size="18" fill="#62645d">PETER MANGIARACINA</text></svg>