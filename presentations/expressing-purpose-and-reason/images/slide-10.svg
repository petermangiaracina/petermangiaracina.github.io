<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#efede6"/><rect x="0" y="0" width="34" height="900" fill="#a33729"/><text x="110" y="72" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="4" fill="#62645d">ENGLISH IN YOUR FACE / GRAMMAR</text><text x="1490" y="72" text-anchor="end" font-family="Arial" font-size="22" fill="#a33729">10</text><line x1="110" y1="100" x2="1490" y2="100" stroke="#c4c4b8" stroke-width="2"/><text x="110" y="165" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#20221f">Purpose or reason?</text><text x="110" y="220" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">1 I went to the bank to get some money.</text><text x="110" y="268" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">2 I stayed home because I was tired.</text><text x="110" y="316" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">3 She whispered so nobody could hear her.</text><text x="110" y="364" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">4 We canceled the game because of the rain.</text><text x="110" y="412" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">5 He studies every night in order to pass the exam.</text><text x="110" y="460" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">6 Since we're finished, let's go home.</text><text x="110" y="842" font-family="Arial" font-size="20" font-weight="700" fill="#a33729">ANSWERS: 1 PURPOSE · 2 REASON · 3 PURPOSE · 4 REASON · 5 PURPOSE · 6 REASON</text><text x="1490" y="842" text-anchor="end" font-family="Arial" font-size="18" fill="#62645d">PETER MANGIARACINA</text></svg>