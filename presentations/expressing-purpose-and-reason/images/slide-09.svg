<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#efede6"/><rect x="0" y="0" width="34" height="900" fill="#a33729"/><text x="110" y="72" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="4" fill="#62645d">ENGLISH IN YOUR FACE / GRAMMAR</text><text x="1490" y="72" text-anchor="end" font-family="Arial" font-size="22" fill="#a33729">09</text><line x1="110" y1="100" x2="1490" y2="100" stroke="#c4c4b8" stroke-width="2"/><text x="110" y="165" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#20221f">SINCE can mean BECAUSE</text><text x="110" y="220" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">SINCE + clause</text><text x="110" y="268" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">Here, since means because.</text><text x="110" y="316" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#20221f"></text><text x="110" y="342" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">Since you're tired, you should go home.</text><text x="110" y="390" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">Since it's raining, let's stay inside.</text><text x="110" y="438" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">Since we have time, let's have a coffee.</text><text x="110" y="486" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">Since nobody answered, I left a message.</text><text x="110" y="842" font-family="Arial" font-size="20" font-weight="700" fill="#a33729">A QUICK NOTE: Since can also refer to time.</text><text x="1490" y="842" text-anchor="end" font-family="Arial" font-size="18" fill="#62645d">PETER MANGIARACINA</text></svg>