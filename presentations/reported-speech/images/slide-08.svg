<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Slide 8 of 8"><rect width="1600" height="900" fill="#efede6"/><rect width="18" height="900" fill="#a53b2d"/><text x="70" y="66" fill="#a53b2d" font-family="Arial" font-size="17" font-weight="700" letter-spacing="2.5">REPORTED SPEECH · CONVERSION</text><line x1="70" y1="93" x2="1525" y2="93" stroke="#c8c7ba"/><text x="70" y="850" fill="#62645d" font-family="Arial" font-size="16">Peter Mangiaracina</text><text x="1518" y="850" fill="#62645d" font-family="Arial" font-size="16" text-anchor="end">08</text><text x="70" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#20221f" font-weight="700">Conversion</text><rect x="70" y="220" width="680" height="48" rx="3" fill="#a53b2d"/><text x="410" y="252" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f8f7f2" font-weight="700" text-anchor="middle">DIRECT</text><rect x="850" y="220" width="675" height="48" rx="3" fill="#4c718c"/><text x="1187.5" y="252" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f8f7f2" font-weight="700" text-anchor="middle">INDIRECT (REPORTED SPEECH)</text><line x1="800" y1="205" x2="800" y2="770" stroke="#c8c7ba" stroke-width="2"/><rect x="70" y="285" width="1455" height="145" fill="#f8f7f2" stroke="#c8c7ba"/><text x="98" y="325" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#a53b2d" font-weight="700">Bob said:</text><text x="98" y="365" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f">“Turn off the light.”</text><text x="98" y="396.05" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f">“Don’t leave the office unlocked.”</text><text x="878" y="325" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4c718c" font-weight="700">Bob told me (command):</text><text x="878" y="365" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f">…to turn off the light.</text><text x="878" y="396.05" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f">…not to leave the office unlocked.</text><rect x="70" y="445" width="1455" height="145" fill="#f8f7f2" stroke="#c8c7ba"/><text x="98" y="485" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#a53b2d" font-weight="700">Kathy said:</text><text x="98" y="525" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f">“Please call me.”</text><text x="98" y="556.05" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f">“Would you mind not smoking?”</text><text x="878" y="485" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4c718c" font-weight="700">Kathy asked me (request):</text><text x="878" y="525" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f">…to call her.</text><text x="878" y="556.05" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f">…not to smoke.</text><rect x="70" y="605" width="1455" height="145" fill="#f8f7f2" stroke="#c8c7ba"/><text x="98" y="645" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#a53b2d" font-weight="700">John said:</text><text x="98" y="685" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f">“You ought to see a doctor.”</text><text x="98" y="716.05" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f">“You shouldn’t buy that car.”</text><text x="878" y="645" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4c718c" font-weight="700">John advised me (advice):</text><text x="878" y="685" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f">…to see a doctor.</text><text x="878" y="716.05" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f">…not to buy that car.</text></svg>