<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Slide 2 of 8"><rect width="1600" height="900" fill="#efede6"/><rect width="18" height="900" fill="#a53b2d"/><text x="70" y="66" fill="#a53b2d" font-family="Arial" font-size="17" font-weight="700" letter-spacing="2.5">REPORTED SPEECH · DEFINITION</text><line x1="70" y1="93" x2="1525" y2="93" stroke="#c8c7ba"/><text x="70" y="850" fill="#62645d" font-family="Arial" font-size="16">Peter Mangiaracina</text><text x="1518" y="850" fill="#62645d" font-family="Arial" font-size="16" text-anchor="end">02</text><text x="70" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#20221f" font-weight="700">Definition</text><text x="70" y="242" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#62645d">If we report what another person has said, we can use the speaker’s exact words (direct</text><text x="70" y="273.2" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#62645d">speech):</text><rect x="70" y="320" width="210" height="48" rx="3" fill="#a53b2d"/><text x="175" y="352" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f8f7f2" font-weight="700" text-anchor="middle">DIRECT SPEECH</text><text x="70" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="37" fill="#20221f" font-weight="700">Mary said, “I’m going to the store for milk.”</text><line x1="70" y1="445" x2="1525" y2="445" stroke="#c8c7ba"/><text x="70" y="500" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#62645d">Or reported (indirect) speech:</text><rect x="70" y="530" width="230" height="48" rx="3" fill="#4c718c"/><text x="185" y="562" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f8f7f2" font-weight="700" text-anchor="middle">INDIRECT SPEECH</text><text x="70" y="615" font-family="Georgia, 'Times New Roman', serif" font-size="37" fill="#20221f" font-weight="700">Mary said (that) she was going to the store for milk.</text><rect x="70" y="680" width="1455" height="95" fill="#263b38" rx="4"/><text x="95" y="720" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#efede6">You need to learn how to transform direct speech into reported speech. The structure differs for statements,</text><text x="95" y="747.3" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#efede6">questions, commands, requests and advice.</text></svg>