<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Slide 3 of 8"><rect width="1600" height="900" fill="#efede6"/><rect width="18" height="900" fill="#a53b2d"/><text x="70" y="66" fill="#a53b2d" font-family="Arial" font-size="17" font-weight="700" letter-spacing="2.5">REPORTED SPEECH · RULES</text><line x1="70" y1="93" x2="1525" y2="93" stroke="#c8c7ba"/><text x="70" y="850" fill="#62645d" font-family="Arial" font-size="16">Peter Mangiaracina</text><text x="1518" y="850" fill="#62645d" font-family="Arial" font-size="16" text-anchor="end">03</text><text x="70" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#20221f" font-weight="700">Rules</text><text x="70" y="242" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#a53b2d" font-weight="700">Mary: “I work at the hospital every day.”</text><rect x="70" y="290" width="700" height="390" fill="#f8f7f2" stroke="#c8c7ba"/><rect x="825" y="290" width="700" height="390" fill="#f8f7f2" stroke="#c8c7ba"/><rect x="94" y="315" width="295" height="48" rx="3" fill="#4c718c"/><text x="241.5" y="347" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f8f7f2" font-weight="700" text-anchor="middle">REPORTING IN THE PRESENT</text><text x="95" y="400" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#62645d">All verbs must agree with the first verb, so when you</text><text x="95" y="431.05" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#62645d">report something in the present, no change is</text><text x="95" y="462.1" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#62645d">necessary:</text><text x="95" y="535" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#20221f" font-weight="700">Mary says that she works</text><text x="95" y="575" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#20221f" font-weight="700">at the hospital every day.</text><text x="95" y="635" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#a53b2d" font-weight="700" letter-spacing="2">NO CHANGE</text><rect x="850" y="315" width="270" height="48" rx="3" fill="#a53b2d"/><text x="985" y="347" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f8f7f2" font-weight="700" text-anchor="middle">REPORTING IN THE PAST</text><text x="850" y="400" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#62645d">When you report something in the past, you must</text><text x="850" y="431.05" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#62645d">consider agreement of tenses:</text><text x="850" y="535" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#20221f" font-weight="700">Mary said that she worked</text><text x="850" y="575" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#20221f" font-weight="700">at the hospital every day.</text><text x="850" y="635" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#a53b2d" font-weight="700" letter-spacing="2">ONE STEP BACK</text><rect x="70" y="710" width="1455" height="75" fill="#263b38"/><text x="98" y="744" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#efede6" font-weight="700">After “said,” the present (works) becomes the past (worked).</text><text x="98" y="770" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#efede6">See the chart on the next page.</text></svg>