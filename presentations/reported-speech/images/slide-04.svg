<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Slide 4 of 8"><rect width="1600" height="900" fill="#efede6"/><rect width="18" height="900" fill="#a53b2d"/><text x="70" y="66" fill="#a53b2d" font-family="Arial" font-size="17" font-weight="700" letter-spacing="2.5">REPORTED SPEECH · CONVERSION</text><line x1="70" y1="93" x2="1525" y2="93" stroke="#c8c7ba"/><text x="70" y="850" fill="#62645d" font-family="Arial" font-size="16">Peter Mangiaracina</text><text x="1518" y="850" fill="#62645d" font-family="Arial" font-size="16" text-anchor="end">04</text><text x="70" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#20221f" font-weight="700">Conversion</text><rect x="70" y="220" width="680" height="48" rx="3" fill="#a53b2d"/><text x="410" y="252" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f8f7f2" font-weight="700" text-anchor="middle">DIRECT — Mary said:</text><rect x="850" y="220" width="675" height="48" rx="3" fill="#4c718c"/><text x="1187.5" y="252" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f8f7f2" font-weight="700" text-anchor="middle">INDIRECT — Mary said/told me (that):</text><line x1="800" y1="205" x2="800" y2="770" stroke="#c8c7ba" stroke-width="2"/><rect x="70" y="278" width="680" height="72" fill="#f8f7f2" stroke="#c8c7ba"/><text x="98" y="320" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#20221f">“I walk to work.”</text><text x="800" y="320" fill="#d3b867" font-family="Georgia" font-size="35" text-anchor="middle">→</text><rect x="850" y="278" width="675" height="72" fill="#f8f7f2" stroke="#c8c7ba"/><text x="878" y="320" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#20221f">…she walked to work.</text><rect x="70" y="358" width="680" height="72" fill="#f8f7f2" stroke="#c8c7ba"/><text x="98" y="400" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#20221f">“I am walking to work.”</text><text x="800" y="4