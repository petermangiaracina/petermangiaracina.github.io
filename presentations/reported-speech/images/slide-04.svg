 to work.”</text><text x="800" y="720" fill="#d3b867" font-family="Georgia" font-size="35" text-anchor="middle">→</text><rect x="850" y="678" width="675" height="72" fill="#f8f7f2" stroke="#c8c7ba"/><text x="878" y="720" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#20221f">…she would walk to work.</text></svg>