<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#efede6"/><rect width="36" height="900" fill="#a33729"/><text x="115" y="72" font-family="Arial" font-size="20" letter-spacing="4" fill="#62645d">ENGLISH IN YOUR FACE</text><text x="1485" y="72" text-anchor="end" font-family="Arial" font-size="22" fill="#a33729">06 / 09</text><line x1="115" y1="102" x2="1485" y2="102" stroke="#c4c4b8" stroke-width="2"/><text x="115" y="185" font-family="Georgia,serif" font-size="60" font-weight="700" fill="#20221f">Wish + Would</text><text x="115" y="250" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">Use WISH + WOULD when you want someone or something to change.</text><text x="115" y="302" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#20221f"></text><text x="115" y="330" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">You drive too fast. → I wish you wouldn’t drive so fast.</text><text x="115" y="382" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">My neighbors keep arguing. → I wish they would stop arguing.</text><text x="115" y="434" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">No one has invented a teleportation machine. → I wish someone would invent one.</text><text x="115" y="840" font-family="Arial" font-size="20" font-weight="700" fill="#a33729">THE FOCUS IS CHANGE</text><text x="1485" y="840" text-anchor="end" font-family="Arial" font-size="18" fill="#62645d">Peter Mangiaracina</text></svg>