<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#efede6"/><rect width="36" height="900" fill="#a33729"/><text x="115" y="72" font-family="Arial" font-size="20" letter-spacing="4" fill="#62645d">ENGLISH IN YOUR FACE</text><text x="1485" y="72" text-anchor="end" font-family="Arial" font-size="22" fill="#a33729">09 / 09</text><line x1="115" y1="102" x2="1485" y2="102" stroke="#c4c4b8" stroke-width="2"/><text x="115" y="185" font-family="Georgia,serif" font-size="60" font-weight="700" fill="#20221f">Quick Review</text><text x="115" y="250" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">PRESENT SITUATION → I wish I knew how to dance.</text><text x="115" y="302" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">ABILITY OR POSSIBILITY → I wish I could speak Italian.</text><text x="115" y="354" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">WANTING SOMETHING TO CHANGE → I wish you wouldn’t drive so fast.</text><text x="115" y="406" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">PAST REGRET → I wish I had studied.</text><text x="115" y="458" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#20221f"></text><text x="115" y="486" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">IF ONLY uses the same constructions more strongly.</text><text x="115" y="840" font-family="Arial" font-size="20" font-weight="700" fill="#a33729">WISH = I WANT REALITY TO BE DIFFERENT.</text><text x="1485" y="840" text-anchor="end" font-family="Arial" font-size="18" fill="#62645d">Peter Mangiaracina</text></svg>