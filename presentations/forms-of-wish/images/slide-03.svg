<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#efede6"/><rect width="36" height="900" fill="#a33729"/><text x="115" y="72" font-family="Arial" font-size="20" letter-spacing="4" fill="#62645d">ENGLISH IN YOUR FACE</text><text x="1485" y="72" text-anchor="end" font-family="Arial" font-size="22" fill="#a33729">03 / 09</text><line x1="115" y1="102" x2="1485" y2="102" stroke="#c4c4b8" stroke-width="2"/><text x="115" y="185" font-family="Georgia,serif" font-size="60" font-weight="700" fill="#20221f">Two Clauses</text><text x="115" y="250" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">Sentences with WISH usually contain two clauses:</text><text x="115" y="302" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#20221f"></text><text x="115" y="330" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">CLAUSE 1   I wish (that)</text><text x="115" y="382" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">CLAUSE 2   I had a million dollars.</text><text x="115" y="434" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#20221f"></text><text x="115" y="462" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">FULL SENTENCE</text><text x="115" y="514" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#20221f">I wish (that) I had a million dollars.</text><text x="115" y="840" font-family="Arial" font-size="20" font-weight="700" fill="#a33729">THAT is optional.</text><text x="1485" y="840" text-anchor="end" font-family="Arial" font-size="18" fill="#62645d">Peter Mangiaracina</text></svg>