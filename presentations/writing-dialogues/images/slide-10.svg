<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Slide 10 of 12"><rect width="1600" height="900" fill="#efede6"/><rect x="0" y="0" width="1600" height="14" fill="#a33729"/><text x="72" y="66" fill="#62645d" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">WRITING DIALOGUES · EXERCISE</text><line x1="72" y1="92" x2="1528" y2="92" stroke="#c4c4b8"/><text x="72" y="850" fill="#62645d" font-family="Arial" font-size="17">Peter Mangiaracina</text><text x="1452" y="850" fill="#62645d" font-family="Arial" font-size="17" text-anchor="end">10 / 12</text><text x="72" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#20221f" font-weight="700">Suggested situations</text><rect x="72" y="240" width="680" height="124" rx="8" fill="#f9f8f3" stroke="#c4c4b8"/><text x="98" y="278" fill="#a33729" font-family="Arial" font-size="18" font-weight="700">01</text><text x="150" y="282" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20221f" font-weight="700">A doctor discusses treatment options with a</text><text x="150" y="308.25" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20221f" font-weight="700">patient.</text><rect x="807" y="240" width="680" height="124" rx="8" fill="#f9f8f3" stroke="#c4c4b8"/><text x="833" y="278" fill="#a33729" font-family="Arial" font-size="18" font-weight="700">02</text><text x="885" y="282" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20221f" font-weight="700">Two doctors argue over a diagnosis.</text><rect x="72" y="390" width="680" height="124" rx="8" fill="#f9f8f3" stroke="#c4c4b8"/><text x="98" y="428" fill="#a33729" font-family="Arial" font-size="18" font-weight="700">03</text><text x="150" y="432" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#20221f" font-weight="700">Telling a family that a loved one has died.</text><rect x="807" y="390" width="680" height="124" rx="8" fill="#f9f8f3" stroke="#c4