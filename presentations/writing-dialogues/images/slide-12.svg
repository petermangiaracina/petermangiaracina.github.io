<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Slide 12 of 12"><rect width="1600" height="900" fill="#efede6"/><rect x="0" y="0" width="1600" height="14" fill="#a33729"/><text x="72" y="66" fill="#62645d" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">WRITING DIALOGUES · THE ASSIGNMENT</text><line x1="72" y1="92" x2="1528" y2="92" stroke="#c4c4b8"/><text x="72" y="850" fill="#62645d" font-family="Arial" font-size="17">Peter Mangiaracina</text><text x="1452" y="850" fill="#62645d" font-family="Arial" font-size="17" text-anchor="end">12 / 12</text><text x="72" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#20221f" font-weight="700">The assignment</text><text x="78" y="260" fill="#a33729" font-family="Arial" font-size="18" font-weight="700">01</text><text x="138" y="260" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f" font-weight="700">Write a dialogue of at least two pages.</text><text x="813" y="260" fill="#a33729" font-family="Arial" font-size="18" font-weight="700">02</text><text x="873" y="260" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f" font-weight="700">Use a word processor. No handwritten</text><text x="873" y="288.75" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f" font-weight="700">assignments, please. Ever.</text><text x="78" y="372" fill="#a33729" font-family="Arial" font-size="18" font-weight="700">03</text><text x="138" y="372" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f" font-weight="700">Format it as described in this</text><text x="138" y="400.75" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f" font-weight="700">presentation.</text><text x="813" y="372" fill="#a33729" font-family="Arial" font-size="18" font-weight="700">04</text><text x="873" y="372" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f" font-weight="700">Use at least two people, but not more than</text><text x="873" y="400.75" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f" font-weight="700">four.</text><text x="78" y="484" fill="#a33729" font-family="Arial" font-size="18" font-weight="700">05</text><text x="138" y="484" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f" font-weight="700">Create a conflict resolved by</text><text x="138" y="512.75" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f" font-weight="700">collaboration and negotiation.</text><text x="813" y="484" fill="#a33729" font-family="Arial" font-size="18" font-weight="700">06</text><text x="873" y="484" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f" font-weight="700">Make copies for your actors, yourself, and</text><text x="873" y="512.75" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f" font-weight="700">for me.</text><text x="78" y="596" fill="#a33729" font-family="Arial" font-size="18" font-weight="700">07</text><text x="138" y="596" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f" font-weight="700">Be prepared to act it out in class for</text><text x="138" y="624.75" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f" font-weight="700">analysis.</text><text x="813" y="596" fill="#a33729" font-family="Arial" font-size="18" font-weight="700">08</text><text x="873" y="596" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f" font-weight="700">You must play one of the characters in</text><text x="873" y="624.75" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f" font-weight="700">your dialogue.</text><text x="78" y="708" fill="#a33729" font-family="Arial" font-size="18" font-weight="700">09</text><text x="138" y="708" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#20221f" font-weight="700">You must direct the actors.</text></svg>