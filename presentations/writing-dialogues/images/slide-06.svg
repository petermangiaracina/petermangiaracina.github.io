<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Slide 6 of 12"><rect width="1600" height="900" fill="#efede6"/><rect x="0" y="0" width="1600" height="14" fill="#a33729"/><text x="72" y="66" fill="#62645d" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">WRITING DIALOGUES · CORE MECHANIC</text><line x1="72" y1="92" x2="1528" y2="92" stroke="#c4c4b8"/><text x="72" y="850" fill="#62645d" font-family="Arial" font-size="17">Peter Mangiaracina</text><text x="1452" y="850" fill="#62645d" font-family="Arial" font-size="17" text-anchor="end">06 / 12</text><text x="72" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#20221f" font-weight="700">Conflict</text><text x="72" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="39" fill="#a33729" font-style="italic">A key ingredient in a good dialogue.</text><rect x="72" y="350" width="450" height="210" rx="8" fill="#f9f8f3" stroke="#c4c4b8"/><text x="98" y="392" fill="#a33729" font-family="Arial" font-size="18" font-weight="700">02</text><text x="98" y="442" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#20221f" font-weight="700">Complication</text><text x="98" y="482" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62645d">Conflict complicates the</text><text x="98" y="508.25" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62645d">situation, so a solution is not</text><text x="98" y="534.5" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62645d">found easily.</text><rect x="575" y="350" width="450" height="210" rx="8" fill="#f9f8f3" stroke="#c4c4b8"/><text x="601" y="392" fill="#a33729" font-family="Arial" font-size="18" font-weight="700">03</text><text x="601" y="442" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#20221f" font-weight="700">Clashing agendas</text><text x="601" y="482" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62645d">Conflict arises when two opposing</text><text x="601" y="508.25" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62645d">personal agendas clash.</text><rect x="1078" y="350" width="450" height="210" rx="8" fill="#f9f8f3" stroke="#c4c4b8"/><text x="1104" y="392" fill="#a33729" font-family="Arial" font-size="18" font-weight="700">04</text><text x="1104" y="442" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#20221f" font-weight="700">Resolution</text><text x="1104" y="482" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62645d">Conflict is resolved by</text><text x="1104" y="508.25" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62645d">negotiation and collaboration.</text><rect x="325" y="605" width="950" height="145" rx="8" fill="#f9f8f3" stroke="#c4c4b8"/><text x="351" y="647" fill="#a33729" font-family="Arial" font-size="18" font-weight="700">05</text><text x="351" y="697" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#20221f" font-weight="700">More language</text><text x="351" y="737" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62645d">Produces a wider range of</text><text x="351" y="763.25" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62645d">emotions, thus more language and</text><text x="351" y="789.5" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62645d">more fun!</text></svg>